    <style>

        :root { --bg:#1e1d1f; --card:#2b2a2c; --line:#414042; --text:#f1f0f0; --muted:#b0adb1; --heading:#fff; --brand:#3b7d41; --brand-hi:#458c4b; --brand-text:#8fd094; --ok:#7bc47f; --wait:#f2c14e; --off:#9c999d; --red:#d9372b; --green:#458c4b; --sun:#f2c14e; }

        :focus-visible { outline:2px solid var(--brand-hi); outline-offset:2px; }
        #search-input { height:46px; padding-block:0; }

        #gov-btn, #bank-btn { min-height:46px; font-size:13px; }
        #loc-toggle { display:flex; gap:.5rem; align-items:stretch; }
        #loc-toggle .loc-opt { flex:1 1 0; height:46px; border-radius:.75rem; padding:0 .75rem; display:flex; align-items:center; justify-content:center; gap:.4rem; font-size:12px; font-weight:600; border:1px solid transparent; cursor:pointer; white-space:nowrap; transition:flex-grow .25s,transform .25s,opacity .25s,background .25s,color .25s,border-color .25s,box-shadow .25s; }

        .sopt { border:0; font-family:inherit; display:flex; align-items:center; justify-content:space-between; gap:.75rem; width:100%; min-height:52px; padding:.6rem 1rem; font-size:15px; font-weight:600; color:var(--text); background:transparent; text-align:start; }

        .sopt:active { background:rgba(69,140,75,.16); }

        .sopt[aria-pressed="true"] { color:var(--brand-text); }

        .sswitch { position:relative; width:46px; height:28px; border-radius:999px; background:var(--line); flex:0 0 auto; transition:background .2s; }
        .sswitch i { position:absolute; top:3px; inset-inline-start:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:inset-inline-start .2s; }

        /* tap animation (slow, soft) */
        @keyframes icon-pop { 0% { scale:1; rotate:0deg; } 30% { scale:.68; rotate:-10deg; } 65% { scale:1.25; rotate:6deg; } 100% { scale:1; rotate:0deg; } }

        .binfo-row { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem; color:var(--text); text-decoration:none; }

            const t = T();
            $('bankinfo-title').textContent = t.bankInfo;
            $('set-bank-label').textContent = t.bankInfo;

      ${f('h-banks', 'بانکەکان (کۆد بە کۆما، وەک NBI, CIB)', e ? vals(e.banks).join(', ') : '')}
      <small>کۆدی بانکەکان: ${BANK_INFO.map(b => b.code).join(' · ')}</small>
      ${f('h-link', 'لینکی نەخشە (ئارەزوومەندانە)', e ? (e.link || '') : '')}
      <div class="row"><button class="btn g" onclick="admCancel()">پاکردنەوە</button><button class="btn" onclick="admSaveHub()">پاشەکەوتکردن</button></div></div>`;
    const list = hubsData.slice().sort((a, b) => b.id - a.id).map(h => `<div class="card"><div class="row"><div><b dir="auto">${h.name}</b><br><small>#${h.id} · ${h.city} · ${h.banks.join(', ')}</small></div><div style="display:flex;gap:.3rem"><button class="btn g" onclick="admEditHub(${h.id})">✎</button><button class="btn d" onclick="admDelHub(${h.id})">🗑</button></div></div></div>`).join('');
    return form + `<h2 style="margin-top:1rem">هابەکان (${hubsData.length})</h2>` + list;
  }
  function banksView() {
    const e = editing && editing.type === 'bank' ? editing.data : null;
    const form = `<div class="card"><b>${e ? 'دەستکاریکردنی بانک ' + e.code : 'زیادکردنی بانک / ژمارە'}</b>
      <div class="g2">${f('b-code', 'کۆد (وەک NBI)', e ? e.code : '', e ? 'disabled' : '')}${f('b-name', 'ناوی بانک', e ? (BANK_NAMES[e.code] || '') : '')}</div>
      <label>ژمارە مۆبایل/تەلەفۆنەکان (هەر ژمارەیەک لە دێڕێک)</label><textarea id="b-ph">${esc(e ? e.phones.map(p => p.t).join('\n') : '')}</textarea>
      <label>ئیمەیڵەکان (هەر یەکە لە دێڕێک)</label><textarea id="b-em">${esc(e ? e.emails.join('\n') : '')}</textarea>
      ${f('b-map', 'لینکی نەخشە', e && e.map !== '#' ? e.map : '')}
      <div class="row"><button class="btn g" onclick="admCancel()">پاکردنەوە</button><button class="btn" onclick="admSaveBank()">پاشەکەوتکردن</button></div></div>`;
    const list = BANK_INFO.map(b => `<div class="card"><div class="row"><div><b>${BANK_NAMES[b.code] || b.code}</b> <small>${b.code}</small><br><small dir="ltr">${b.phones.map(p => p.t).join(' · ')}</small></div><div style="display:flex;gap:.3rem"><button class="btn g" onclick="admEditBank('${b.code}')">✎</button><button class="btn d" onclick="admDelBank('${b.code}')">🗑</button></div></div></div>`).join('');
    return form + `<h2 style="margin-top:1rem">بانکەکان (${BANK_INFO.length})</h2>` + list;
  }
  const v = (id) => (document.getElementById(id) || {}).value || '';
  const lines = (s) => s.split('\n').map(x => x.trim()).filter(Boolean);
  async function run(fn, ok) { try { await fn(); msg = ok; } catch (e) { msg = e.message === 'login' ? 'تکایە دووبارە بچۆرەوە ژوورەوە' : e.message; if (e.message === 'login') sess = null; } admRender(); window.scrollTo(0, 0); root.scrollTop = 0; }
  window.admTab = (t) => { tab = t; editing = null; msg = ''; admRender(); };
  window.admCancel = () => { editing = null; admRender(); };
  window.admLogin = async () => { const m = document.getElementById('a-msg'); try { await signIn(v('a-em').trim(), v('a-pw')); msg = ''; admRender(); } catch (e) { m.style.display = 'block'; m.textContent = e.message; } };
  window.admLogout = () => { sess = null; ls.del('adm1'); admRender(); };
  window.admEditHub = (id) => { const raw = remote.hubs[id] && !remote.hubs[id].deleted ? { id, ...remote.hubs[id] } : BASE_HUBS.find(h => h.id === id); editing = { type: 'hub', data: { ...raw, id } }; admRender(); root.scrollTop = 0; };
  window.admEditBank = (c) => { editing = { type: 'bank', data: BANK_INFO.find(b => b.code === c) }; admRender(); root.scrollTop = 0; };
  window.admSaveHub = () => {
    const id = Number(v('h-id')), lat = Number(v('h-lat')), lon = Number(v('h-lon')), name = v('h-name').trim();
    if (!id || !name || !v('h-lat') || !v('h-lon') || !isFinite(lat) || !isFinite(lon)) { msg = 'ناو و Latitude و Longitude پێویستن'; return admRender(); }
    const banks = v('h-banks').split(/[,\s]+/).map(b => b.toUpperCase().replace(/[^A-Z0-9]/g, '')).filter(Boolean);
    const hub = { name, gov: v('h-gov'), city: v('h-city').trim(), loc: 'City Center', atm: Number(v('h-atm')) || banks.length || 1, status: v('h-st'), lat, lon, link: v('h-link').trim() || `https://www.google.com/maps?q=${lat},${lon}`, banks };
    editing = null; run(() => write('hubs/' + id, hub), 'هاب پاشەکەوت کرا ✓ — بۆ هەموو بەکارهێنەران دەردەکەوێت');
  };
  window.admDelHub = (id) => { if (!confirm('دڵنیای لە سڕینەوەی هاب #' + id + '؟')) return; run(() => write('hubs/' + id, BASE_HUBS.some(h => h.id === id) ? { deleted: true } : null), 'هاب سڕایەوە'); };
  window.admSaveBank = () => {
    const code = (editing ? editing.data.code : v('b-code')).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code || !v('b-name').trim()) { msg = 'کۆد و ناوی بانک پێویستن'; return admRender(); }
    const bank = { name: v('b-name').trim(), phones: lines(v('b-ph')), emails: lines(v('b-em')), map: v('b-map').trim() };
    editing = null; run(() => write('banks/' + code, bank), 'بانک/ژمارە پاشەکەوت کرا ✓ — بۆ هەموو بەکارهێنەران دەردەکەوێت');
  };
  window.admDelBank = (c) => { if (!confirm('دڵنیای لە سڕینەوەی ' + c + '؟')) return; run(() => write('banks/' + c, BASE_INFO.some(b => b.code === c) ? { deleted: true } : null), 'سڕایەوە'); };
})();
</script>
</body>
</html>
